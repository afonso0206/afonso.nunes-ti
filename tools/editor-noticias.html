<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editor local de atualizações</title><style>body{font-family:Segoe UI,system-ui;background:#f6f8fb;color:#14213d;margin:0}.wrap{max-width:1000px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(20,33,61,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin:8px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd6e1;border-radius:8px;font:inherit}textarea{min-height:100px}button{padding:10px 14px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,#ff5b4d,#ff9f43);color:#fff}.secondary{background:#e9eef5}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px}.item{border-top:1px solid #e5e7eb;padding:12px 0}.item:first-child{border-top:0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Editor local de atualizações profissionais</h1><p class="notice" id="guard"></p><div class="card"><div class="grid"><div><label>Data</label><input id="data" type="date"></div><div><label>Categoria</label><input id="categoria"></div><div><label>Título</label><input id="titulo"></div><div><label>Status</label><input id="status"></div></div><label>Resumo</label><textarea id="resumo"></textarea><label>Conteúdo</label><textarea id="conteudo"></textarea><label><input id="destaque" type="checkbox" style="width:auto"> Mostrar na página inicial</label><div class="actions"><button class="primary" id="salvar">Adicionar atualização</button><button class="secondary" id="limpar">Limpar</button></div></div><div class="card"><h2>Atualizações cadastradas</h2><div id="lista"></div><div class="actions"><button class="primary" id="baixar">Baixar noticias.json</button><button class="secondary" id="carregar">Recarregar arquivo atual</button></div></div><script>const remote=!['localhost','127.0.0.1'].includes(location.hostname),f=id=>document.getElementById(id);let items=[],editing=null;f('guard').textContent=remote?'Editor bloqueado fora do computador local. Abra pelo XAMPP em localhost.':'Editor local ativo. Ao terminar, baixe noticias.json e substitua dados/noticias.json.';async function load(){try{items=await(await fetch('../dados/noticias.json?'+Date.now())).json()}catch(e){items=[]}render()}function render(){items.sort((a,b)=>b.data.localeCompare(a.data));f('lista').innerHTML=items.map((x,i)=>`<div class="item"><strong>${x.data} — ${x.titulo}</strong><br><small>${x.categoria} · ${x.status}${x.destaque?' · destaque':''}</small><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editItem(${i})">Editar</button><button class="danger" onclick="delItem(${i})">Excluir</button></div></div>`).join('')||'<p>Nenhuma atualização.</p>'}function clearForm(){editing=null;['data','categoria','titulo','status','resumo','conteudo'].forEach(id=>f(id).value='');f('destaque').checked=false;f('salvar').textContent='Adicionar atualização'}window.editItem=i=>{editing=i;const x=items[i];['data','categoria','titulo','status','resumo','conteudo'].forEach(id=>f(id).value=x[id]||'');f('destaque').checked=!!x.destaque;f('salvar').textContent='Salvar alteração';scrollTo({top:0,behavior:'smooth'})};window.delItem=i=>{if(confirm('Excluir esta atualização?')){items.splice(i,1);render()}};f('salvar').onclick=()=>{if(remote)return;const t=f('titulo').value.trim(),d=f('data').value,r=f('resumo').value.trim();if(!d||!t||!r)return alert('Preencha data, título e resumo.');const slug=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const x={id:(d+'-'+slug).slice(0,90),data:d,categoria:f('categoria').value.trim(),titulo:t,resumo:r,conteudo:f('conteudo').value.trim(),status:f('status').value.trim(),destaque:f('destaque').checked};editing===null?items.push(x):items[editing]=x;clearForm();render()};f('limpar').onclick=clearForm;f('carregar').onclick=load;f('baixar').onclick=()=>{if(remote)return;const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noticias.json';a.click();URL.revokeObjectURL(a.href)};if(remote)document.querySelectorAll('button,input,textarea').forEach(el=>el.disabled=true);load();</script></div></body></html>
